
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f1e6">
  <title>佛光普照祈福加持區｜客服專區</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f7f3eb;
      color: #514637;
      line-height: 1.9;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 34px 20px 120px;
    }

    .hero {
      text-align: center;
      padding: 30px 12px 26px;
    }

    .symbol {
      color: #b18b50;
      font-size: 34px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: #80643c;
      font-size: 25px;
      line-height: 1.6;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 12px;
      color: #9b8668;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .divider {
      width: 54px;
      height: 1px;
      background: #c8ad7d;
      margin: 22px auto 0;
    }

    .card {
      background: #fffdf8;
      border: 1px solid #e9dfce;
      border-radius: 15px;
      padding: 23px 21px;
      margin: 17px 0;
      box-shadow: 0 5px 18px rgba(100, 78, 43, 0.045);
    }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #f2eadb;
      color: #9b7947;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }

    h2 {
      margin: 0;
      color: #80643c;
      font-size: 18px;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      color: #6d6253;
      font-size: 15px;
      text-align: justify;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #a18e70;
      font-size: 13px;
    }

    .community-button {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 18px;
      max-width: 580px;
      margin: auto;
      padding: 15px 12px;
      border-radius: 50px;
      background: #927448;
      color: #fffdf8;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 5px 18px rgba(83, 62, 30, 0.2);
    }

    @media (max-width: 380px) {
      h1 { font-size: 22px; }
      .card { padding: 20px 17px; }
      .card p { font-size: 14px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <div class="symbol">☸</div>
      <h1>佛光普照祈福加持區<br>客服專區</h1>
      <div class="subtitle">以誠心交流・以善念相伴</div>
      <div class="divider"></div>
    </header>

    <section class="card">
      <div class="card-heading">
        <div class="icon">☏</div>
        <h2>選單使用與問題諮詢</h2>
      </div>
      <p>
        使用中若有任何問題或需要協助，請隨時在聊天室留言，
        我們將竭誠為您服務。
      </p>
    </section>

    <section class="card">
      <div class="card-heading">
        <div class="icon">蓮</div>
        <h2>圓滿回報</h2>
      </div>
      <p>
        於聊天室中，回報歷屆圓滿吉星高照、蓮花宴千日千句聖號等
        相關圓滿事項，讓我們每一份祈願與功德都能圓滿回向。
      </p>
    </section>

    <section class="card">
      <div class="card-heading">
        <div class="icon">🙏</div>
        <h2>弘法社群與祈福卡申請</h2>
      </div>
      <p>
        記得要加入當家師父空中弘法社群及「佛光普照祈福加持區」，
        隨時掌握各項弘法資訊、佛菩薩聖誕相關祈福卡申請公告，
        以免錯過重要訊息。
      </p>
    </section>

    <div class="footer">
      感恩您的參與・願一切吉祥圓滿
    </div>
  </main>

  <div class="community-button">
    加入與當家師父互動加持社群
  </div>
</body>
</html>
